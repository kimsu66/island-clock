<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="섬 시계">
<title>섬 시계</title>
<link rel="apple-touch-icon" href="apple-touch-icon-nov.png">
<link rel="icon" type="image/png" href="icon-nov.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --ink: rgba(255,255,255,0.88);
    --glow: rgba(255,255,255,0.55);
    --bg: #7da544;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #7da544; }
  }
  :root[data-theme="dark"] { --bg: #7da544; }

  html, body {
    margin: 0; height: 100%;
    overscroll-behavior: none;
    touch-action: none;
    background: var(--bg);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  video {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    pointer-events: none;
    opacity: 0;
    transition: opacity .8s ease;
  }
  video.on { opacity: 1; }
  #app {
    position: absolute; top: 0; left: 0;
    width: 100%; height: var(--app-h, 100%);
    overflow: hidden;
  }
  .clock {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: -apple-system, "SF Pro Display", system-ui, "Apple SD Gothic Neo", sans-serif;
    color: var(--ink);
    text-shadow: 0 0 0.12em var(--glow), 0 0.04em 0.18em rgba(40,70,110,0.25);
    line-height: 1;
    padding-bottom: 22vh;
  }
  .date {
    font-size: min(7.5vh, 4.6vw);
    font-weight: 600;
    letter-spacing: 0.04em;
    white-space: pre;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 1px 6px rgba(40,60,110,0.25);
    margin-bottom: 3vh;
  }
  .time {
    font-size: min(58vh, 30vw);
    font-weight: 500;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    transform: scaleY(1.32);
    transform-origin: center top;
    /* 잠금화면 시계 같은 반투명 유리 느낌 */
    color: transparent;
    background: linear-gradient(180deg, rgba(236,236,255,0.88) 0%, rgba(225,228,255,0.72) 60%, rgba(255,240,220,0.62) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-stroke: 1px rgba(255,255,255,0.55);
    text-shadow: none;
    filter: drop-shadow(0 2px 6px rgba(50,60,120,0.18));
  }
  .hint {
    position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    font: 13px/1.4 -apple-system, "Apple SD Gothic Neo", sans-serif;
    color: #fff; background: rgba(0,0,0,0.35);
    padding: 6px 12px; border-radius: 999px;
    transition: opacity .6s; white-space: nowrap;
  }
  .hint.off { opacity: 0; pointer-events: none; }

  /* ── 시계 모양: 오른쪽 위 한 줄 ── */
  .clock { transition: opacity .5s ease; }
  body.corner .clock {
    inset: auto;
    top: max(18px, calc(env(safe-area-inset-top) + 6px));
    right: max(24px, calc(env(safe-area-inset-right) + 12px));
    flex-direction: row; align-items: baseline; gap: 0.7em;
    padding: 0;
  }
  body.corner .date {
    font-size: min(4.6vh, 2.8vw);
    margin: 0;
  }
  body.corner .time {
    font-size: min(6.4vh, 3.9vw);
    font-weight: 600;
    letter-spacing: 0;
    transform: none;
    color: rgba(255,255,255,0.97);
    background: none;
    -webkit-text-stroke: 0;
    text-shadow: 0 1px 6px rgba(40,60,110,0.3);
    filter: none;
  }

  /* ── 메뉴 ── */
  .menu-btn {
    position: absolute;
    top: max(16px, calc(env(safe-area-inset-top) + 4px));
    left: max(18px, calc(env(safe-area-inset-left) + 10px));
    width: 44px; height: 44px; border-radius: 50%;
    border: 0; padding: 0;
    background: rgba(20,30,50,0.38);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    display: grid; place-items: center;
    opacity: 0; pointer-events: none;
    transition: opacity .35s ease;
  }
  .menu-btn.show { opacity: 1; pointer-events: auto; }
  .menu-btn svg { width: 20px; height: 20px; stroke: #fff; }
  .panel {
    position: absolute;
    top: max(68px, calc(env(safe-area-inset-top) + 56px));
    left: max(18px, calc(env(safe-area-inset-left) + 10px));
    padding: 10px; border-radius: 18px;
    background: rgba(20,30,50,0.5);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    display: flex; flex-direction: column; gap: 12px;
    max-width: calc(100vw - 36px); box-sizing: border-box;
    font: 600 13px/1.2 -apple-system, "Apple SD Gothic Neo", sans-serif;
    color: #fff;
    opacity: 0; pointer-events: none; transform: translateY(-6px);
    transition: opacity .25s ease, transform .25s ease;
  }
  .panel.open { opacity: 1; pointer-events: auto; transform: none; }
  .opt {
    border: 2px solid transparent; border-radius: 12px;
    background: rgba(255,255,255,0.12); color: inherit; font: inherit;
    padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .opt.sel { border-color: rgba(255,255,255,0.9); }
  .opt .mini {
    width: 84px; height: 48px; border-radius: 6px;
    background: linear-gradient(180deg, #7fb3e8 0%, #a9cf7a 70%, #7da544 100%);
    position: relative;
  }
  .opt .mini i { position: absolute; background: rgba(255,255,255,0.95); border-radius: 2px; }
  .mini.c i:nth-child(1) { left: 34px; top: 9px;  width: 16px; height: 3px; }
  .mini.c i:nth-child(2) { left: 22px; top: 15px; width: 40px; height: 16px; opacity: .8; }
  .mini.r i:nth-child(1) { right: 26px; top: 7px; width: 18px; height: 3px; }
  .mini.r i:nth-child(2) { right: 6px;  top: 6px; width: 16px; height: 5px; }
  .sec-h {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    font-size: 12px; font-weight: 600; opacity: .85; margin: 0 2px 7px;
  }
  .row { display: flex; gap: 10px; }
  .row.vers { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; }
  .row.vers::-webkit-scrollbar { display: none; }
  .edit-btn {
    border: 0; border-radius: 999px; padding: 4px 10px;
    background: rgba(255,255,255,0.18); color: #fff;
    font: 600 12px/1.2 -apple-system, "Apple SD Gothic Neo", sans-serif;
  }
  .edit-btn.on { background: #fff; color: #1d2a40; }
  .ver { flex: none; cursor: pointer; }
  .ver .thumb {
    width: 84px; height: 48px; border-radius: 6px;
    background: #7da544 center/cover no-repeat; position: relative;
  }
  .ver .thumb b {
    position: absolute; left: 4px; top: 4px; padding: 1px 5px; border-radius: 4px;
    background: rgba(0,0,0,.45); font-size: 10px; font-weight: 700; letter-spacing: .04em;
  }
  .ver input {
    display: none; width: 84px; box-sizing: border-box;
    border: 0; border-radius: 6px; padding: 3px 4px;
    font: 600 16px/1.2 -apple-system, "Apple SD Gothic Neo", sans-serif;
    text-align: center; color: #1d2a40; background: #fff;
    -webkit-user-select: text; user-select: text;
  }
  .panel.editing .ver[data-v]:not([data-v="auto"]) input { display: block; }
  .panel.editing .ver[data-v]:not([data-v="auto"]) .lbl { display: none; }
  .panel.editing .ver[data-v="auto"] { opacity: .4; }
</style>
</head>
<body>
<div id="app">
  <video id="vA" class="bg on" autoplay muted playsinline webkit-playsinline preload="auto"></video>
  <video id="vB" class="bg" muted playsinline webkit-playsinline preload="auto"></video>

  <div class="clock">
    <div class="date" id="date"></div>
    <div class="time" id="time"></div>
  </div>

  <button class="menu-btn" id="menuBtn" aria-label="메뉴">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="panel" id="panel">
    <div class="sec">
      <div class="sec-h">시계 모양</div>
      <div class="row">
        <button class="opt" data-layout="center"><span class="mini c"><i></i><i></i></span>가운데</button>
        <button class="opt" data-layout="corner"><span class="mini r"><i></i><i></i></span>오른쪽 위</button>
      </div>
    </div>
    <div class="sec">
      <div class="sec-h">섬 영상 <button class="edit-btn" id="editBtn">이름 수정</button></div>
      <div class="row vers" id="vers"></div>
    </div>
  </div>

  <div class="hint" id="hint">화면을 탭하면 메뉴가 나와요</div>
</div>

<script>
  const days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const dateEl = document.getElementById('date');
  const timeEl = document.getElementById('time');
  const pad = n => String(n).padStart(2, '0');

  function tick() {
    const d = new Date();
    dateEl.textContent =
      pad(d.getFullYear() % 100) + ' ' + pad(d.getMonth() + 1) + ' ' + pad(d.getDate()) + '  ' + days[d.getDay()];
    const h = d.getHours() % 12 || 12;
    timeEl.textContent = h + ':' + pad(d.getMinutes());
    setTimeout(tick, 1000 - d.getMilliseconds() + 5);
  }
  tick();

  // ── 화면 꽉 채우기 ──────────────────────────────
  // iOS/iPadOS 홈 화면 앱은 화면 높이를 상태바만큼 짧게 계산하는 버그가 있어서,
  // 전체화면일 때는 실제 기기 화면 크기만큼 영상을 키움
  function fit() {
    const portrait = window.innerHeight >= window.innerWidth;
    const sw = portrait ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
    const sh = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    const full = Math.abs(window.innerWidth - sw) <= 2;   // 분할화면이 아닐 때만
    const h = full ? Math.max(sh, window.innerHeight) : window.innerHeight;
    document.documentElement.style.setProperty('--app-h', h + 'px');
    window.scrollTo(0, 0);
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', () => { fit(); setTimeout(fit, 400); });
  window.addEventListener('scroll', () => { if (window.scrollY) window.scrollTo(0, 0); });
  document.addEventListener('touchmove', e => { if (!e.target.closest('.panel')) e.preventDefault(); }, { passive: false });

  // ── 섬 영상 버전 ──────────────────────────────
  // 새 버전을 추가할 때: VERSIONS 맨 뒤에 하나 추가 (from = 자동 모드에서 쓰기 시작하는 날짜)
  // 각 버전의 schedule(h)는 시각(0~23)을 받아 그 시간에 틀 영상 목록을 돌려줌 (여러 개면 번갈아)
  const VERSIONS = [
    { id: 'oct', label: '10월', from: new Date(2026, 9, 13), thumb: 'thumbs/oct.jpg',
      schedule(h) {
        if (h >= 7 && h < 8)   return ['am7.mp4'];
        if (h >= 8 && h < 9)   return ['am8a.mp4', 'am8b.mp4'];
        if (h >= 9 && h < 10)  return ['am9.mp4'];
        if (h >= 10 && h < 13) return ['bg.mp4', 'am10.mp4'];
        if (h >= 13 && h < 14) return ['pm1.mp4'];
        if (h >= 14 && h < 16) return ['pm2.mp4'];
        if (h >= 16 && h < 17) return ['pm4.mp4', 'pm4b.mp4'];
        if (h >= 17 && h < 18) return ['pm5.mp4'];
        if (h >= 18 && h < 22) return ['pm6.mp4'];
        return ['pm10.mp4'];
      } },
    { id: 'nov15', label: '11월 15일', from: new Date(2026, 10, 15), thumb: 'thumbs/nov15.jpg',
      schedule(h) {
        if (h >= 7 && h < 18) return ['nov/h' + pad(h) + '.mp4'];
        return ['nov/h18.mp4'];
      } },
    { id: 'nov22', label: '11월 22일', from: new Date(2026, 10, 22), thumb: 'thumbs/nov22.jpg',
      schedule(h) {
        if (h >= 7 && h < 16) return ['nov22/h' + pad(h) + '.mp4'];
        if (h === 16)         return ['nov22/h16a.mp4', 'nov22/h16b.mp4'];
        if (h === 17)         return ['nov22/h17.mp4'];
        return ['nov22/h18.mp4'];
      } },
  ];

  const store = {
    get(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : v; } catch (e) { return def; } },
    set(k, v)   { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  let chosen = store.get('islandVersion', 'auto');           // 'auto' 또는 버전 id
  let names = {};
  try { names = JSON.parse(store.get('islandVersionNames', '{}')) || {}; } catch (e) {}
  const nameOf = v => names[v.id] || v.label;

  function autoVersion(d) {
    let pick = VERSIONS[0];
    for (const v of VERSIONS) if (d >= v.from) pick = v;
    return pick;
  }
  function activeVersion(d) {
    return VERSIONS.find(v => v.id === chosen) || autoVersion(d);
  }
  function playlistFor(d) {
    return activeVersion(d).schedule(d.getHours());
  }

  let cur = document.getElementById('vA');
  let nxt = document.getElementById('vB');
  let list = [], idx = 0;

  const play = v => { const p = v.play(); if (p) p.catch(() => {}); };

  // 다음 영상을 뒤에 준비해 두었다가 자연스럽게 바꿔치기
  function swapTo(src) {
    nxt.loop = (list.length === 1);
    if (!nxt.src.endsWith(src)) { nxt.src = src; nxt.load(); }
    nxt.currentTime = 0;
    play(nxt);
    nxt.classList.add('on');
    cur.classList.remove('on');
    const old = cur; cur = nxt; nxt = old;
    setTimeout(() => { old.pause(); preloadNext(); }, 900);
  }
  function preloadNext() {
    if (list.length > 1) {
      const src = list[(idx + 1) % list.length];
      if (!nxt.src.endsWith(src)) { nxt.src = src; nxt.load(); }
    }
  }
  function onEnded(e) {
    if (e.target !== cur || list.length < 2) return;
    idx = (idx + 1) % list.length;
    swapTo(list[idx]);
  }
  document.getElementById('vA').addEventListener('ended', onEnded);
  document.getElementById('vB').addEventListener('ended', onEnded);

  function checkSchedule() {
    const l = playlistFor(new Date());
    if (l.join() !== list.join()) {
      list = l; idx = 0;
      if (!cur.src) {                 // 처음 열 때
        cur.src = list[0]; cur.loop = (list.length === 1); play(cur); preloadNext();
      } else {
        swapTo(list[0]);
      }
    }
  }
  checkSchedule();
  setInterval(checkSchedule, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkSchedule(); play(cur); lock(); } });

  // 화면 꺼짐 방지
  let wakeLock = null;
  async function lock() {
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) {}
  }
  const hint = document.getElementById('hint');

  // ── 시계 모양 선택 (이 기기에만 기억) ──
  const menuBtn = document.getElementById('menuBtn');
  const panel = document.getElementById('panel');
  function setLayout(name) {
    document.body.classList.toggle('corner', name === 'corner');
    panel.querySelectorAll('.opt[data-layout]').forEach(o => o.classList.toggle('sel', o.dataset.layout === name));
    try { localStorage.setItem('clockLayout', name); } catch (e) {}
  }
  let saved = 'center';
  try { saved = localStorage.getItem('clockLayout') || 'center'; } catch (e) {}
  setLayout(saved);

  let hideTimer;
  function showMenuBtn() {
    menuBtn.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => { if (!panel.classList.contains('open')) menuBtn.classList.remove('show'); }, 3500);
  }
  function closePanel() {
    if (panel.classList.contains('editing')) editBtn.click();   // 수정 중이면 저장하고 닫기
    panel.classList.remove('open');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => menuBtn.classList.remove('show'), 1500);
  }
  // ── 섬 영상 버전 선택 + 이름 수정 ──
  const vers = document.getElementById('vers');
  const editBtn = document.getElementById('editBtn');
  function renderVersions() {
    const latest = autoVersion(new Date());
    const chips = [{ id: 'auto', thumb: latest.thumb, auto: true }, ...VERSIONS];
    vers.innerHTML = '';
    for (const v of chips) {
      const el = document.createElement('div');
      el.className = 'opt ver' + (v.id === chosen ? ' sel' : '');
      el.dataset.v = v.id;
      el.innerHTML = '<span class="thumb"></span><span class="lbl"></span><input maxlength="12">';
      el.querySelector('.thumb').style.backgroundImage = 'url(' + v.thumb + ')';
      if (v.auto) el.querySelector('.thumb').innerHTML = '<b>AUTO</b>';
      el.querySelector('.lbl').textContent = v.auto ? '자동 (최신)' : nameOf(v);
      if (!v.auto) el.querySelector('input').value = nameOf(v);
      vers.appendChild(el);
    }
  }
  function chooseVersion(id) {
    chosen = id; store.set('islandVersion', id);
    renderVersions();
    checkSchedule();
  }
  function saveNames() {
    vers.querySelectorAll('.ver').forEach(el => {
      const v = VERSIONS.find(x => x.id === el.dataset.v);
      if (!v) return;
      const t = el.querySelector('input').value.trim();
      if (t && t !== v.label) names[v.id] = t; else delete names[v.id];
    });
    store.set('islandVersionNames', JSON.stringify(names));
  }
  editBtn.addEventListener('click', e => {
    e.stopPropagation();
    const editing = panel.classList.toggle('editing');
    editBtn.classList.toggle('on', editing);
    editBtn.textContent = editing ? '완료' : '이름 수정';
    if (!editing) { saveNames(); renderVersions(); }
  });
  vers.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); editBtn.click(); } });
  renderVersions();

  menuBtn.addEventListener('click', e => {
    e.stopPropagation();
    panel.classList.contains('open') ? closePanel() : (panel.classList.add('open'), clearTimeout(hideTimer));
  });
  panel.addEventListener('click', e => {
    e.stopPropagation();
    if (e.target.closest('input')) return;
    const ver = e.target.closest('.ver');
    if (ver) {
      if (panel.classList.contains('editing')) return;
      chooseVersion(ver.dataset.v); setTimeout(closePanel, 350); return;
    }
    const o = e.target.closest('.opt');
    if (o) { setLayout(o.dataset.layout); setTimeout(closePanel, 350); }
  });

  document.addEventListener('click', () => {
    play(cur); lock(); hint.classList.add('off');
    if (panel.classList.contains('open')) closePanel(); else showMenuBtn();
  });
  setTimeout(() => hint.classList.add('off'), 6000);
</script>
</body>
</html>
